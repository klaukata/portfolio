name: Build GitHub Pages

on:
  push:
    branches:
      - '*'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public
        # enable Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # package and upload a /public folder as an artifact that can be deployed
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with: 
          path: ./public
  # publish an artifact
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4