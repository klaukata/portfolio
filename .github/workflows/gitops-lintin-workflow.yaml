name: Gitops folder Linting Workflow

on:
  push:
    branches:
      - '*'

jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout /gitops folder
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
             gitops
      - name: Prettify Code
        uses: creyD/prettier_action@v4.3
        with:
          prettier_options: --check .